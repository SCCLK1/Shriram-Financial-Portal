name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 267451755767.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-024d2f169ada353c0

jobs:
  build-and-deploy:
    name: Build, Push to ECR & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push shriram-micro-digest
        run: |
          docker build \
            -t $ECR_REGISTRY/shriram-micro-digest:${{ steps.tag.outputs.SHA }} \
            -t $ECR_REGISTRY/shriram-micro-digest:latest \
            .
          docker push $ECR_REGISTRY/shriram-micro-digest:${{ steps.tag.outputs.SHA }}
          docker push $ECR_REGISTRY/shriram-micro-digest:latest

      - name: Build & push shriram-market-digest
        run: |
          docker build \
            -t $ECR_REGISTRY/shriram-market-digest:${{ steps.tag.outputs.SHA }} \
            -t $ECR_REGISTRY/shriram-market-digest:latest \
            .
          docker push $ECR_REGISTRY/shriram-market-digest:${{ steps.tag.outputs.SHA }}
          docker push $ECR_REGISTRY/shriram-market-digest:latest

      - name: Deploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $EC2_INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters "commands=[
              'export ECR_REGISTRY=${{ env.ECR_REGISTRY }}',
              'export IMAGE_TAG=${{ steps.tag.outputs.SHA }}',
              'cd /opt/shriram',
              'docker compose -f docker-compose.prod.yml pull shriram-micro-digest shriram-market-digest',
              'docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate shriram-micro-digest shriram-market-digest',
              'docker compose -f docker-compose.prod.yml ps'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for completion
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id $EC2_INSTANCE_ID

          # Print output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id $EC2_INSTANCE_ID \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      - name: Verify deployment
        run: |
          echo "Deployed shriram-micro-digest:${{ steps.tag.outputs.SHA }}"
          echo "Deployed shriram-market-digest:${{ steps.tag.outputs.SHA }}"
          echo "Live at: http://3.6.13.101"
